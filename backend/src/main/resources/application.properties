# Server Configuration - Running on port 8082
server.port=${PORT:8082}

# Application Name
spring.application.name=course-registration-system

# MySQL Database Configuration (Default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/crs_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=luckyadmin@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (Hibernate automatically detects MySQL / H2 dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS allowed origins
cors.allowed.origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
